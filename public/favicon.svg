<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="DistantPluto favicon">
    <defs>
        <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#9dd9ff" />
            <stop offset="100%" stop-color="#5f8ecb" />
        </linearGradient>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#dfffb8" />
            <stop offset="100%" stop-color="#8fdb8f" />
        </linearGradient>
    </defs>

    <rect width="128" height="128" rx="18" fill="#080f1b" />

    <g fill="#f7f1cf">
        <rect x="18" y="22" width="4" height="4" />
        <rect x="31" y="16" width="3" height="3" />
        <rect x="101" y="21" width="4" height="4" />
        <rect x="90" y="35" width="3" height="3" />
        <rect x="24" y="94" width="4" height="4" />
        <rect x="97" y="97" width="3" height="3" />
    </g>

    <ellipse cx="64" cy="72" rx="42" ry="14" fill="none" stroke="url(#ring)" stroke-width="8" />
    <circle cx="64" cy="64" r="28" fill="url(#planet)" />
    <rect x="52" y="53" width="13" height="8" fill="#b8f1ff" opacity="0.5" />
    <rect x="66" y="68" width="11" height="6" fill="#2f5f99" opacity="0.5" />
